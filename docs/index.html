<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nifty Swing Screener</title>
<style>
  :root{
    --ink-bg: #0e1512;
    --ink-bg-raised: #141d19;
    --ledger-line: #2a3730;
    --paper: #e7e0cd;
    --paper-dim: #9ba79c;
    --brass: #c99a44;
    --brass-dim: #8a6b34;
    --gain: #6ea36b;
    --stamp: #a13d2f;
    --font-display: 'Fraunces', 'Georgia', serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink-bg);
    background-image: linear-gradient(var(--ledger-line) 1px, transparent 1px);
    background-size: 100% 34px;
    color: var(--paper);
    font-family: var(--font-body);
    padding: 32px 20px 80px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 2px solid var(--brass-dim);
    padding-bottom: 18px; margin-bottom: 10px; flex-wrap: wrap; gap: 12px;
  }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; margin: 0; }
  h1 span { color: var(--brass); font-style: italic; font-weight: 600; }
  .subtitle {
    font-family: var(--font-mono); font-size: 0.78rem; color: var(--paper-dim);
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  .meta-bar {
    font-family: var(--font-mono); font-size: 0.75rem; color: var(--paper-dim);
    margin-bottom: 24px; display: flex; gap: 24px; flex-wrap: wrap;
  }
  .meta-bar b { color: var(--brass); }

  .panel {
    background: var(--ink-bg-raised); border: 1px solid var(--ledger-line);
    border-radius: 4px; padding: 20px 22px; margin-bottom: 22px;
  }
  .panel h2 {
    font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--brass); margin: 0 0 14px;
  }
  .config-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
    gap: 10px 18px; font-family: var(--font-mono); font-size: 0.78rem; color: var(--paper-dim);
  }
  .config-grid b { color: var(--paper); display: block; font-size: 0.95rem; margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.84rem; }
  thead th {
    text-align: left; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--brass); border-bottom: 1px solid var(--brass-dim); padding: 8px 10px; white-space: nowrap;
  }
  tbody td { padding: 9px 10px; border-bottom: 1px solid var(--ledger-line); white-space: nowrap; }
  tbody tr:hover { background: rgba(201,154,68,0.05); }
  .sym { font-weight: 600; color: var(--paper); }
  .pass-stamp {
    display: inline-block; font-family: var(--font-display); font-weight: 700; font-size: 0.68rem;
    color: var(--stamp); border: 1.5px solid var(--stamp); border-radius: 3px; padding: 1px 6px;
    transform: rotate(-6deg); letter-spacing: 0.05em;
  }
  .num-good { color: var(--gain); }

  .empty-state, .error-state {
    text-align: center; padding: 50px 20px; color: var(--paper-dim);
    font-family: var(--font-mono); font-size: 0.85rem;
  }
  .error-state { color: var(--stamp); }

  .history-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .helptext-inline { font-family: var(--font-mono); font-size: 0.72rem; color: var(--paper-dim); }

  .day-block {
    border: 1px solid var(--ledger-line); border-radius: 4px;
    margin-bottom: 14px; overflow: hidden; background: var(--ink-bg-raised);
  }
  .day-block summary {
    cursor: pointer; list-style: none; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px 20px;
  }
  .day-block summary::-webkit-details-marker { display: none; }
  .day-block summary .day-date {
    font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: var(--paper);
  }
  .day-block summary .day-meta {
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--paper-dim);
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .day-block summary .day-meta b { color: var(--brass); }
  .day-block summary::before {
    content: '▸'; color: var(--brass); margin-right: 10px; font-size: 0.8rem;
    transition: transform 0.15s ease; display: inline-block;
  }
  .day-block[open] summary::before { transform: rotate(90deg); }
  .day-block .day-body { padding: 0 18px 18px; border-top: 1px solid var(--ledger-line); }
  .day-block .day-body table { margin-top: 14px; }

  footer {
    margin-top: 40px; font-family: var(--font-mono); font-size: 0.7rem;
    color: var(--paper-dim); text-align: center; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Swing <span>Screener</span></h1>
      <div class="subtitle">Daily RSI Pullback · Weekly RSI Confirmation · NSE Cash Market</div>
    </div>
  </header>
  <div class="meta-bar" id="metaBar">Loading archive…</div>

  <div class="panel" id="configPanel" style="display:none">
    <h2>Current Filter Settings</h2>
    <div class="config-grid" id="configGrid"></div>
  </div>

  <div class="panel">
    <h2>Screened Days</h2>
    <div id="resultsArea"><div class="empty-state">Loading…</div></div>
  </div>

  <footer>Educational tool only · Not investment advice · Verify signals independently before trading</footer>
</div>

<script>
const CONCURRENCY = 6;

function renderDayTable(data) {
  if (!data.results || data.results.length === 0) {
    return '<div class="empty-state">No stocks met all filters on this scan.</div>';
  }
  let html = `<table><thead><tr>
    <th>Symbol</th><th>Close</th><th>Daily RSI</th><th>Weekly RSI</th><th>Monthly RSI</th>
    <th>EMA20</th><th>EMA200</th><th>Stop</th><th>Target 3R</th><th>Turnover (₹Cr)</th><th></th>
  </tr></thead><tbody>`;
  for (const r of data.results) {
    html += `<tr>
      <td class="sym">${r.symbol}</td>
      <td>₹${r.close.toFixed(2)}</td>
      <td>${r.dailyRsi.toFixed(1)}</td>
      <td class="num-good">${r.weeklyRsi.toFixed(1)}</td>
      <td class="num-good">${r.monthlyRsi.toFixed(1)}</td>
      <td>₹${r.ema20.toFixed(2)}</td>
      <td>₹${r.ema200.toFixed(2)}</td>
      <td>₹${r.stopLoss.toFixed(2)}</td>
      <td>₹${r.target3R.toFixed(2)}</td>
      <td>${r.avgTurnoverCr.toFixed(1)}</td>
      <td><span class="pass-stamp">PASS</span></td>
    </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

function renderConfig(cfg) {
  const configPanel = document.getElementById('configPanel');
  const configGrid = document.getElementById('configGrid');
  configGrid.innerHTML = `
    <div>Daily RSI trigger<b>${cfg.rsiEntryTrigger}</b></div>
    <div>Weekly RSI min<b>${cfg.weeklyRsiMin}</b></div>
    <div>Monthly RSI min<b>${cfg.monthlyRsiMin}</b></div>
    <div>Oversold floor<b>${cfg.rsiOversoldFloor}</b></div>
    <div>Trend EMA<b>${cfg.emaTrend}</b></div>
    <div>Fast EMA<b>${cfg.emaFast}</b></div>
    <div>Min turnover (₹Cr)<b>${cfg.minAvgTurnoverCr}</b></div>
  `;
  configPanel.style.display = 'block';
}

async function fetchDate(dateStr) {
  const res = await fetch(`./history/${dateStr}.json?_=${Date.now()}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

async function fetchAllWithConcurrency(dates) {
  const results = new Array(dates.length);
  const queue = dates.map((d, i) => [d, i]);

  async function worker() {
    while (queue.length) {
      const [dateStr, i] = queue.shift();
      try {
        results[i] = { dateStr, data: await fetchDate(dateStr), ok: true };
      } catch (e) {
        results[i] = { dateStr, error: e.message, ok: false };
      }
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  return results;
}

async function init() {
  const metaBar = document.getElementById('metaBar');
  const resultsArea = document.getElementById('resultsArea');

  try {
    const idxRes = await fetch('./history/index.json?_=' + Date.now());
    if (!idxRes.ok) throw new Error('no history index found');
    const idx = await idxRes.json();
    const dates = idx.dates || [];

    if (dates.length === 0) {
      metaBar.innerHTML = '';
      resultsArea.innerHTML = '<div class="empty-state">No archived scans yet. Run the workflow once from the Actions tab to generate the first one.</div>';
      return;
    }

    metaBar.innerHTML = `<span><b>${dates.length}</b> day${dates.length === 1 ? '' : 's'} archived · back to <b>${dates[dates.length - 1]}</b></span>`;

    const allDays = await fetchAllWithConcurrency(dates); // already ordered newest-first, matching dates[]

    // show current config from the most recent successful day
    const latestOk = allDays.find(d => d.ok);
    if (latestOk) renderConfig(latestOk.data.config);

    let html = '';
    allDays.forEach((day, i) => {
      if (!day.ok) {
        html += `<details class="day-block"><summary>
          <span class="day-date">${day.dateStr}</span>
          <span class="day-meta error-state" style="padding:0;">Failed to load: ${day.error}</span>
        </summary></details>`;
        return;
      }
      const d = day.data;
      html += `<details class="day-block" ${i === 0 ? 'open' : ''}>
        <summary>
          <span class="day-date">${day.dateStr}</span>
          <span class="day-meta">
            <span>Scanned <b>${d.universeSize}</b></span>
            <span>Passed <b>${d.resultsCount}</b></span>
          </span>
        </summary>
        <div class="day-body">${renderDayTable(d)}</div>
      </details>`;
    });
    resultsArea.innerHTML = html;

  } catch (e) {
    metaBar.innerHTML = '';
    resultsArea.innerHTML = `<div class="error-state">Couldn't load the archive (${e.message}). Make sure the GitHub Action has run at least once.</div>`;
  }
}

init();
</script>
</body>
</html>

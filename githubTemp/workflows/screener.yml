name: Daily RSI Screener

on:
  schedule:
    # 10:30 UTC = 16:00 IST, Mon-Fri (after NSE close at 15:30 IST)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python rsi_screener.py

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results.json
          git diff --quiet --cached || git commit -m "Update screener results $(date -u +%Y-%m-%d)"
          git push
